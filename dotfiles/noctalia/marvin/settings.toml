[nightlight]
enabled = true

[plugin_settings."noctalia/umbriel-companion"]
panel_placement = "floating"

[plugins]
enabled = [ "heprado/ideapad-fan", "heprado/monitor-settings", "heprado/net-usage", "noctalia/umbriel-companion" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
corner_radius_scale = 0.0
avatar_path = "/home/henrique/Pictures/tama-gintama-tama-gintama-robot.gif"

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    wallpaper_placement = "floating"

    [shell.launcher]
    app_grid = true

[theme]
builtin = "Noctalia"
custom_palette = "henrique"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "kcolorscheme", "qt", "umbriel" ]
    community_ids = [ "ungoogled-chromium", "discord", "telegram", "zed" ]
    enable_community_templates = true

[wallpaper.default]
path = "/home/henrique/Pictures/tama.png"

[wallpaper.last]
path = "/home/henrique/Pictures/tama.png"

[wallpaper.monitors.HDMI-A-1]
path = "/home/henrique/Pictures/tama.png"

[wallpaper.monitors.eDP-1]
path = "/home/henrique/Pictures/tama.png"

[widget.widget]
type = "heprado/ideapad-fan:widget"

[widget.launcher]
capsule = true
glyph = "snowflake"

[widget.workspaces]
capsule = true
empty_color = "on_surface_variant"
focused_color = "primary"
occupied_color = "on_surface"
style = "minimal"

[widget.layout]
capsule = true
scroll_cycles_layout = false
type = "noctalia/umbriel-companion:bar"

[widget.cpu]
capsule = true
glyph = "cpu"
show_tooltip = false
stat = "cpu_usage"
type = "sysmon"

[widget.ram]
capsule = true
custom_image = "/home/henrique/.local/share/noctalia/icons/memory-stick.svg"
custom_image_colorize = true
show_tooltip = false
stat = "ram_used"
type = "sysmon"

[widget.temp]
capsule = true
show_tooltip = false
stat = "cpu_temp"
type = "sysmon"

[widget.gpu]
capsule = true
custom_image = "/home/henrique/.local/share/noctalia/icons/gpu.svg"
custom_image_colorize = true
show_tooltip = false
stat = "gpu_usage"
type = "sysmon"

[widget.gpu_temp]
capsule = true
show_tooltip = false
stat = "gpu_temp"
type = "sysmon"

[widget.gpu_vram]
capsule = true
custom_image = "/home/henrique/.local/share/noctalia/icons/memory-stick.svg"
custom_image_colorize = true
show_tooltip = false
stat = "gpu_vram"
type = "sysmon"

[widget.disk]
capsule = true
path = "/"
show_tooltip = false
stat = "disk_used_pct"
type = "sysmon"

[widget.net]
capsule = true
type = "heprado/net-usage:widget"

[widget.clock]
capsule = true
format = "{:%H:%M}"
tooltip_format = "{:%A, %d/%m/%Y}"

[widget.network]
show_label = false

[widget.media]
hide_when_no_media = true
peek = true

[widget.refresh_rate]
type = "heprado/monitor-settings:widget"
