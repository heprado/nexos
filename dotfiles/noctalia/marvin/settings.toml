config_version = 19

[bar.default]
background_opacity = 0.0
capsule_radius = 0.0
radius = 0.0
center = [ "clock" ]
end = [ "refresh_rate", "group:g1", "group:g2" ]
compositor_blur = false
concave_edge_corners = false
margin_ends = 0
shadow = false
show_on_workspace_switch = false
start = [ "launcher", "workspaces", "layout", "group:g4", "group:g5", "disk", "net" ]

    [[bar.default.capsule_group]]
    accordion = false
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g1"
    members = [ "media", "tray" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g2"
    members = [ "notifications", "clipboard", "network", "bluetooth", "widget", "battery", "volume", "session" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g4"
    members = [ "cpu", "ram", "temp" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g5"
    members = [ "gpu", "gpu_vram", "gpu_temp" ]
    opacity = 1.0
    padding = 6.0

[control_center]
circular_avatar = false

[location]
address = "São Paulo, Brasil"
custom_schedule = true
sunrise = "07:00"
sunset = "18:00"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@WAYLAND-1",
    "lockscreen-login-box@FALLBACK"
