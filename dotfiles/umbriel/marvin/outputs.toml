# Base settings per output; Monitor Settings reapplies its saved layout at login.
# Synced with ~/.config/umbriel/outputs.toml at each activation.
#
# workspaces = 3 caps each output at 3 and creates all of them at session start.

[output.HDMI-A-1]
mode = "1920x1080@119.982"
position = [0, 0]
scale = 1.0
focus_at_startup = true
workspaces = 3

[output.eDP-1]
mode = "1920x1080@60.008"
position = [1920, 121]
scale = 1.5
workspaces = 3
