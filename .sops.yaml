keys:
  # The admin age key: henrique's own, a recipient of every secrets file,
  # so they can be edited and re-encrypted (new host, lost host key)
  # without depending on any machine's key. Post-quantum (ML-KEM-768 +
  # X25519): these files stay in git history for good. Its private half
  # is passphrase-protected and lives on a USB stick (keys/admin.age),
  # never in this repo:
  #   age-keygen -pq | age -p -a > /path/to/stick/keys/admin.age
  # (prints "Public key: age1pq1..." -- that goes here).
  - &admin 
  # caixa's age public key: its SSH host key converted with ssh-to-age.
  # machines/caixa/install.sh generates that key on the installer, rewrites
  # this line and re-encrypts secrets/caixa.yaml for it with the admin key.
  - &caixa age1vrkn52npsrc4z8j56p2s2fmckel5lsus30xcup3mg23mgu4fhfqs2uerjq
  # PLACEHOLDER -- marvin's age public key. Generate a real keypair with
  # `age-keygen` (doesn't need to happen on marvin itself), replace this
  # value with the real public key, and save the private half to
  # keys/marvin-key.txt (gitignored). See secrets/README.md.
  - &marvin age1vnwf0vr9z9lm02nyvtry9cqsg6857e2cj2u7vxlk88qg85pa9cgq94kmjs

creation_rules:
  - path_regex: secrets/caixa\.yaml$
    key_groups:
      - age:
          - *admin
          - *caixa
  - path_regex: secrets/marvin\.yaml$
    key_groups:
      - age:
          - *admin
          - *marvin
